<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Brush Buddy 3D — Kids Brushing Timer</title>
<link rel="stylesheet" href="brush_buddy.css" />
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Brush Buddy 3D</h1>
      <div class="subhead">Drag/zoom to move the teeth • Debug shows coordinates</div>
    </div>
    <div class="total-time" id="totalPill" title="Total time since Start">
      <span class="total-label">Total</span>
      <span class="total-value" id="totalTime">0:00</span>
    </div>
  </header>

  <div class="card">
    <div class="phases" id="phases" aria-label="Routine phases"></div>
    <div class="countdown" id="countdown">—</div>
    <div class="three-wrap" aria-label="3D teeth model">
      <div id="threeRoot"></div>
      <div class="step-overlay" id="stepNum">Step 1</div>
      <div id="hud" class="hud">
        <div><strong>Debug</strong> — camera & target</div>
        <pre id="hudText"></pre>
        <div class="row"><button id="copyBtn">Copy</button></div>
      </div>
      <div class="hint">Tip: pinch to zoom, drag to orbit</div>
    </div>

    <div class="status">
      <div class="step-label" id="stepLabel">Ready</div>
      <div class="step-hint" id="stepHint">Tap Start when ready</div>
    </div>

    <button id="checkoffBtn" class="checkoff" style="display:none" disabled></button>

    <div class="progress"><i id="progFill"></i></div>

    <div class="controls">
      <button id="backBtn" class="ghost">◀︎ Prev</button>
      <button id="startBtn" class="primary">Start</button>
      <button id="nextBtn" class="ghost">Next ▶︎</button>
    </div>

    <div class="controls-secondary">
      <button id="pauseBtn" class="ghost">Pause</button>
      <button id="resetBtn" class="ghost">Reset</button>
      <button id="debugBtn" class="ghost">Debug</button>
    </div>

  </div>
</div>

<script type="module">
/* Use esm.sh so all imports resolve on iPhone without import maps */
import * as THREE from "https://esm.sh/three@0.160.0";
import { GLTFLoader } from "https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
import { OrbitControls } from "https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js";
/* Steps, timings, and timer helpers live in routine.js */
import {
  PHASES, buildRoutine, formatTime, checkoffStatus,
  brushStepNumber, plannedProgress, phaseStatus, TotalTimer,
} from "./routine.js";

/* ------------ UI + Timer ------------ */
const routine = buildRoutine();   // rinse → floss → mouthwash → 16 brushing steps
const ui = {
  countdown: document.getElementById('countdown'),
  stepLabel: document.getElementById('stepLabel'),
  stepHint:  document.getElementById('stepHint'),
  stepNum:   document.getElementById('stepNum'),
  progFill:  document.getElementById('progFill'),
  startBtn:  document.getElementById('startBtn'),
  pauseBtn:  document.getElementById('pauseBtn'),
  hud:       document.getElementById('hud'),
  hudText:   document.getElementById('hudText'),
  copyBtn:   document.getElementById('copyBtn'),
  checkoff:  document.getElementById('checkoffBtn'),
  phases:    document.getElementById('phases'),
  totalPill: document.getElementById('totalPill'),
  totalTime: document.getElementById('totalTime'),
};
// started: true from the first Start until Reset (unlocks the check-off button)
let state = { idx:0, secondsLeft: routine[0].duration, running:false, started:false, ticker:null };
const totalTimer = new TotalTimer();
function beep(freq=880, ms=120){ try{ const C=new (window.AudioContext||window.webkitAudioContext)(); const o=C.createOscillator(),g=C.createGain(); o.type='sine'; o.frequency.value=freq; g.gain.value=0.02; o.connect(g); g.connect(C.destination); o.start(); setTimeout(()=>{o.stop();C.close();},ms);}catch{} }
/* Two rising notes for a check-off or the end of the routine */
function chime(){ beep(660,110); setTimeout(()=>beep(990,180), 130); }
function vibrate(pattern){ navigator.vibrate && navigator.vibrate(pattern); }

/* Flash a random background color briefly */
function flashRandomBg(ms=500, color='red'){
  const overlay = document.createElement('div');
  overlay.className = 'flash-overlay';
  overlay.style.backgroundColor = color;
  overlay.style.animationDuration = ms + 'ms';
  document.body.appendChild(overlay);
  overlay.addEventListener('animationend', ()=> overlay.remove(), { once:true });
}

/* ------------ 3D Scene ------------ */
const container = document.getElementById('threeRoot');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf3f7ff);

const camera = new THREE.PerspectiveCamera(36, container.clientWidth/container.clientHeight, 0.01, 200);
camera.position.set(0, 0.2, 2.0);

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const dir = new THREE.DirectionalLight(0xffffff, 1.0);
dir.position.set(1.2, 1.1, 1.5);
scene.add(dir);

// Controls (moveable model)
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.9;
controls.zoomSpeed = 0.6;
controls.panSpeed = 0.8;
//controls.target.set(0,0,0);

// Root
const root = new THREE.Group();
scene.add(root);
let model=null, bcenter=new THREE.Vector3(), bradius=0;

// Load model (converted metallic-roughness)
const loader = new GLTFLoader();
loader.load('./teeth_mr.glb',
  (gltf)=>{
    model = gltf.scene;

    // Ensure visible
    model.traverse(n=>{
      if(n.isMesh){ n.frustumCulled = false; n.castShadow=false; n.receiveShadow=false; }
    });

    root.add(model);

    // 🔸 Scale up 2× (per your request)
    // model.scale.multiplyScalar(2);

    // Center & bounds
    const box = new THREE.Box3().setFromObject(model);
    const size = new THREE.Vector3();
    const center = new THREE.Vector3();

    box.getSize(size);
    box.getCenter(center);

    if(Math.max(size.x,size.y,size.z) > 1e-6){
      model.position.sub(center);
      box.setFromObject(model);
    }
    const sphere = box.getBoundingSphere(new THREE.Sphere());
    bcenter.copy(sphere.center);
    bradius = Math.max(sphere.radius/1.5, 1e-3);


    // Auto-frame
    fitCameraToSphere(camera, bcenter, bradius, 1.35, new THREE.Vector3(0.6, 0.35, 0.9));
    controls.target.copy(bcenter);
    controls.update();

    // Start sequence
    setCameraToKey(cameraKeyFor(state.idx), true);
    renderStep();
    updateHud();
  },
  undefined,
  (err)=>{
    ui.stepHint.textContent = 'Could not load teeth_mr.glb — is it next to this file?';
    console.error(err);
  }
);

// Fit camera util
function fitCameraToSphere(cam, center, radius, zoom=1.2, dirHint=new THREE.Vector3(0,0,1)){
  const fov = cam.fov * Math.PI/180;
  const dist = (radius * zoom) / Math.sin(fov/2);
  const dir = dirHint.clone().normalize();
  cam.position.copy(center).addScaledVector(dir, dist);
  cam.near = Math.max(0.01, dist - radius*2);
  cam.far  = dist + radius*2 + 5;
  cam.updateProjectionMatrix();
  cam.lookAt(center);
}

// Views (directional) → converted to positions relative to model radius
function viewPositionFromDir(dir, zoom=1.25){
  if(!bradius) return new THREE.Vector3(0,0,2);
  const fov = camera.fov * Math.PI/180;
  const dist = (bradius * zoom) / Math.sin(fov/2);
  const d = dir.clone().normalize();
  return bcenter.clone().addScaledVector(d, dist);
}
const VIEW_DIRS = {
  'upper-chew-right': new THREE.Vector3( 0.4,  -0.6,  1.2),
  // 'upper-chew-right': new THREE.Vector3( 0.8,  0.5,  0.8),
  'upper-chew-left' : new THREE.Vector3(-0.4,  -0.6,  1.2),
  // 'upper-chew-left' : new THREE.Vector3(-0.8,  0.5,  0.8),
  'upper-front'     : new THREE.Vector3( 0.0,  0.4,  1.2),
  'upper-behind'    : new THREE.Vector3( 0.0,  0.6, -1.9),
  'upper-in-left'   : new THREE.Vector3(-0.8,  0.5, -0.2),
  'upper-out-left'  : new THREE.Vector3(-0.8,  0.3,  0.6),
  'upper-in-right'  : new THREE.Vector3( 0.8,  0.5, -0.2),
  'upper-out-right' : new THREE.Vector3( 0.8,  0.3,  0.6),

  'lower-chew-right': new THREE.Vector3( 0.8, -0.4,  0.8),
  'lower-chew-left' : new THREE.Vector3(-0.8, -0.4,  0.8),
  'lower-front'     : new THREE.Vector3( 0.0, -0.2,  1.2),
  'lower-behind'    : new THREE.Vector3( 0.0, -0.4, -0.9),
  'lower-in-left'   : new THREE.Vector3(-0.8, -0.3, -0.2),
  'lower-out-left'  : new THREE.Vector3(-0.8, -0.3,  0.6),
  'lower-in-right'  : new THREE.Vector3( 0.8, -0.3, -0.2),
  'lower-out-right' : new THREE.Vector3( 0.8, -0.3,  0.6),

  // Front view, zoomed out, for the dancing teeth (check-off steps and Done)
  'dance'           : new THREE.Vector3( 0.0,  0.25, 1.2),
};
const VIEW_ZOOM = { 'dance': 1.75 };

/* Check-off steps and the Done screen use the dance view */
function cameraKeyFor(idx){
  const s = routine[idx];
  return (!s || s.type === 'checkoff') ? 'dance' : s.key;
}

// Camera tween
let tweenStart = 0, tweenDur = 550;
const startPos = new THREE.Vector3(), endPos = new THREE.Vector3();

function setCameraToKey(key, immediate=false){
  if(!bradius) return;
  const dir = VIEW_DIRS[key] ? VIEW_DIRS[key].clone() : new THREE.Vector3(0,0,1);
  const dst = viewPositionFromDir(dir, VIEW_ZOOM[key]);
  controls.target.copy(bcenter); // keep target locked on teeth
  controls.update();
  if(immediate){
    camera.position.copy(dst);
    camera.lookAt(bcenter);
    controls.update();
    return;
  }
  startPos.copy(camera.position);
  endPos.copy(dst);
  tweenStart = performance.now();
}
function updateTween(now){
  const t = Math.min(1, (now - tweenStart)/tweenDur);
  const e = t<0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
  camera.position.lerpVectors(startPos, endPos, e);
  camera.lookAt(bcenter);
  controls.update();
}

/* ------------ Dance (check-off steps and Done) ------------
 * The teeth dance while a check-off step runs, and party at the end.
 * danceAmp eases between 0 (still) and 1 (full dance), so the teeth
 * glide back to rest before the brushing camera views start. */
let danceAmp = 0, danceStyle = 'swish', lastFrame = 0;
function currentDance(){
  if(state.idx >= routine.length) return state.started ? 'party' : null;
  const s = routine[state.idx];
  return (state.running && s.type === 'checkoff') ? s.dance : null;
}
function updateDance(now){
  const dt = lastFrame ? Math.min(0.1, (now - lastFrame)/1000) : 0;
  lastFrame = now;
  const want = currentDance();
  if(want) danceStyle = want;
  danceAmp += ((want ? 1 : 0) - danceAmp) * (1 - Math.exp(-dt*5));
  if(!want && danceAmp < 0.001){ danceAmp = 0; root.position.set(0,0,0); root.rotation.set(0,0,0); return; }

  const t = now/1000, r = bradius || 1, a = danceAmp;
  let px=0, py=0, rx=0, ry=0, rz=0;
  switch(danceStyle){
    case 'swish':  // rinse: sway side to side, like water that sloshes
      px = Math.sin(t*3.5)*r*0.15; rz = Math.sin(t*3.5)*0.15; ry = Math.sin(t*1.75)*0.25; break;
    case 'floss':  // the "floss" dance: hips go one way, shoulders go the other
      px = Math.sin(t*7)*r*0.18; ry = -Math.sin(t*7)*0.35; py = Math.abs(Math.cos(t*7))*r*0.06; break;
    case 'wobble': // mouthwash: bubbly bounce and twist
      py = Math.abs(Math.sin(t*5))*r*0.2; ry = Math.sin(t*1.6)*0.7; rz = Math.sin(t*5)*0.1; break;
    case 'party':  // done: big happy hop and turn
      py = Math.abs(Math.sin(t*4))*r*0.22; ry = Math.sin(t*1.3)*1.4; rx = Math.sin(t*2.6)*0.12; break;
  }
  root.position.set(px*a, py*a, 0);
  root.rotation.set(rx*a, ry*a, rz*a);
}

/* ------------ Total time display ------------ */
let shownTotal = -1;
function renderTotal(){
  const sec = totalTimer.elapsedSeconds();
  if(sec !== shownTotal){ shownTotal = sec; ui.totalTime.textContent = formatTime(sec); }
}

/* ------------ Render & Resize ------------ */
function onResize(){
  const w = container.clientWidth, h = container.clientHeight;
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w,h,false);
}
window.addEventListener('resize', onResize);
renderer.setAnimationLoop((now)=>{
  now = now || performance.now();
  updateTween(now); updateDance(now); renderTotal();
  renderer.render(scene, camera);
});

/* ------------ Debug toggle & HUD ------------ */
let debugOn = false, savedMaterials = [];
function updateHud(){
  if(!debugOn) return;
  const pos = camera.position, tgt = controls.target;
  const dist = pos.distanceTo(tgt);
  const az = controls.getAzimuthalAngle?.() ?? 0; // radians
  const pol = controls.getPolarAngle?.() ?? 0;    // radians
  const to3 = (v)=>`${v.x.toFixed(3)}, ${v.y.toFixed(3)}, ${v.z.toFixed(3)}`;
  ui.hudText.textContent =
`pos:  (${to3(pos)})
tgt:  (${to3(tgt)})
dist: ${dist.toFixed(3)}
azim: ${az.toFixed(3)} rad (${(az*180/Math.PI).toFixed(1)}°)
polar:${pol.toFixed(3)} rad (${(pol*180/Math.PI).toFixed(1)}°)`;
}
function toggleDebug(){
  debugOn = !debugOn;
  ui.hud.style.display = debugOn ? 'block' : 'none';
  if(!model) return;
  if(debugOn){
    savedMaterials = [];
    model.traverse(n=>{
      if(n.isMesh){ savedMaterials.push([n, n.material]); n.material = new THREE.MeshNormalMaterial(); }
    });
    updateHud();
  }else{
    savedMaterials.forEach(([mesh, mat])=> mesh.material = mat);
    savedMaterials = [];
  }
}
document.getElementById('debugBtn').addEventListener('click', toggleDebug);
ui.copyBtn.addEventListener('click', async ()=>{
  try{ await navigator.clipboard.writeText(ui.hudText.textContent); ui.hudText.textContent += "\n(copied)"; setTimeout(updateHud, 1200);}catch{}
});
controls.addEventListener('change', updateHud);

/* ------------ Timer wiring ------------ */
const countdown = document.getElementById('countdown');

/* Phase chips: 💧 Rinse · 🧵 Floss · 🫧 Mouthwash · 🪥 Brush */
ui.phases.innerHTML = PHASES.map(p =>
  `<div class="phase" data-phase="${p.id}"><span class="phase-emoji">${p.emoji}</span><span class="phase-name">${p.name}</span></div>`
).join('');
function renderPhases(){
  const st = phaseStatus(routine, state.idx);
  ui.phases.querySelectorAll('.phase').forEach(el => {
    el.classList.toggle('active', st[el.dataset.phase] === 'active');
    el.classList.toggle('done',   st[el.dataset.phase] === 'done');
  });
}

/* Big check-off button and hint text for rinse / floss / mouthwash */
function renderCheckoff(){
  const s = routine[state.idx];
  const btn = ui.checkoff;
  if(!s || s.type !== 'checkoff'){
    btn.style.display = 'none'; btn.classList.remove('pulse'); countdown.classList.remove('ok');
    return;
  }
  const st = checkoffStatus(s, state.secondsLeft);
  const ready = state.started && st.unlocked;
  btn.style.display = '';
  btn.disabled = !ready;
  btn.classList.toggle('pulse', ready && st.timeUp);
  countdown.classList.toggle('ok', ready);

  if(!state.started){
    btn.textContent = s.checkoffText;
    ui.stepHint.textContent = s.minSeconds > 0
      ? `${s.hint} · ${s.minSeconds}–${s.maxSeconds} seconds`
      : `${s.hint} · up to ${s.maxSeconds} seconds`;
  } else if(!st.unlocked){
    btn.textContent = `🔒 ${s.keepGoing}… ${formatTime(st.secondsToUnlock)}`;
    ui.stepHint.textContent = s.hint;
  } else {
    btn.textContent = `✅ ${s.checkoffText}`;
    ui.stepHint.textContent = st.timeUp ? `Time's up! Tap the green button` : `Done? Tap the green button!`;
  }
}

/* Per-second parts: countdown, progress bar, check-off button */
function renderTimer(){
  countdown.textContent = formatTime(state.secondsLeft);
  ui.progFill.style.width = (plannedProgress(routine, state.idx, state.secondsLeft) * 100).toFixed(1) + '%';
  renderCheckoff();
  renderTotal();
}

function renderStep({ sound = true } = {}){
  renderPhases();
  ui.totalPill.classList.toggle('done', state.idx >= routine.length);
  if(state.idx >= routine.length){
    ui.stepLabel.textContent = 'Done!';
    ui.stepHint.textContent  = `All done in ${formatTime(totalTimer.elapsedSeconds())} — great job!`;
    ui.stepNum.textContent   = '🎉 All done';
    countdown.textContent = '0:00'; ui.progFill.style.width = '100%';
    renderCheckoff(); renderTotal();
    setCameraToKey(cameraKeyFor(state.idx), false);
    if(sound) chime();
    vibrate([80,40,80]); return;
  }
  const s = routine[state.idx];
  ui.stepLabel.textContent = s.label;
  if(s.type === 'checkoff'){
    const p = PHASES.find(p => p.id === s.phase);
    ui.stepNum.textContent = `${p.emoji} ${p.name}`;
  } else {
    ui.stepNum.textContent  = `Step ${brushStepNumber(routine, state.idx)}`;
    ui.stepHint.textContent = `Brush this area for ${s.duration} seconds`;
  }
  renderTimer();
  setCameraToKey(cameraKeyFor(state.idx), false);
  if(sound){ beep(); vibrate(40); }
}

/* Move to the next step (Next button, brushing timer, or check-off) */
function advance(opts){
  if(state.idx < routine.length) state.idx++;
  if(state.idx >= routine.length){ stopTicker(); renderStep(opts); return; }
  state.secondsLeft = routine[state.idx].duration;
  renderStep(opts);
}
function nextStep(){ flashRandomBg(); advance(); }
function prevStep(){ state.idx = Math.max(0, state.idx-1); state.secondsLeft = routine[state.idx].duration; renderStep(); }

/* The kid taps "I did a good job …" */
function checkOff(){
  const s = routine[state.idx];
  if(!s || s.type !== 'checkoff' || !state.started) return;
  if(!checkoffStatus(s, state.secondsLeft).unlocked) return;
  flashRandomBg(600, '#2ecc71'); chime(); vibrate([40,30,80]);
  advance({ sound:false });
}

/* One tick per second.
 * Brushing: count down, then go to the next step (same as before).
 * Check-off: count down to 0, then wait for the check-off button. */
function tick(){
  const s = routine[state.idx];
  if(!s){ stopTicker(); return; }
  if(state.secondsLeft > 0){
    state.secondsLeft--;
    if(s.type === 'checkoff'){
      const st = checkoffStatus(s, state.secondsLeft);
      if(st.timeUp){ beep(660,220); vibrate([60,40,60]); }                    // time is up: wait for button
      else if(s.minSeconds > 0 && st.elapsed === s.minSeconds){ beep(1320,90); vibrate(40); } // button unlocks
    }
    renderTimer();
  } else if(s.type !== 'checkoff'){
    nextStep();
  }
}
function startTicker(){
  if(state.running) return; state.running = true; state.started = true;
  totalTimer.start();
  ui.startBtn.textContent='Running...'; ui.startBtn.classList.remove('primary'); ui.startBtn.disabled = true;
  state.ticker = setInterval(tick, 1000);
  renderTimer();
}
function stopTicker(){ state.running=false; clearInterval(state.ticker); state.ticker=null; totalTimer.pause(); ui.startBtn.textContent='Start'; ui.startBtn.classList.add('primary'); ui.startBtn.disabled=false; }
function pauseToggle(){
  if(state.idx >= routine.length) return;   // nothing to pause on the Done screen
  if(state.running){ clearInterval(state.ticker); state.ticker=null; state.running=false; totalTimer.pause(); renderTotal(); ui.pauseBtn.textContent='Resume'; }
  else { startTicker(); ui.pauseBtn.textContent='Pause'; }
}
function resetAll(){ stopTicker(); state.idx=0; state.started=false; totalTimer.reset(); state.secondsLeft = routine[0].duration; renderStep(); ui.pauseBtn.textContent='Pause'; }

/* Buttons */
document.getElementById('startBtn').addEventListener('click', ()=>{
  if(state.idx >= routine.length) resetAll();
  if(bradius){ setCameraToKey(cameraKeyFor(state.idx), true); }
  startTicker(); beep(); vibrate(80);
});
document.getElementById('nextBtn').addEventListener('click', nextStep);
document.getElementById('backBtn').addEventListener('click', prevStep);
document.getElementById('pauseBtn').addEventListener('click', pauseToggle);
document.getElementById('resetBtn').addEventListener('click', resetAll);
ui.checkoff.addEventListener('click', checkOff);

// Initialize
state.secondsLeft = routine[0].duration; renderStep();
</script>
</body>
</html>
